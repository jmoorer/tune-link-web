   <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>${appName} - Apple Music Login</title>
      <script src="https://js-cdn.music.apple.com/musickit/v1/musickit.js" data-web-components async></script>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
          text-align: center;
          margin: 0;
          padding: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: #f5f5f7;
        }
        .container {
          max-width: 600px;
          padding: 30px;
          background-color: white;
          border-radius: 10px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
          color: #333;
          margin-bottom: 30px;
        }
        .button {
          background-color: #000;
          color: white;
          border: none;
          padding: 12px 24px;
          font-size: 16px;
          border-radius: 8px;
          cursor: pointer;
          display: flex;
          align-items: center;
          margin: 20px auto;
          transition: background-color 0.3s;
        }
        .button:hover {
          background-color: #333;
        }
        .button svg {
          margin-right: 10px;
          width: 20px;
          height: 20px;
        }
        .status {
          margin-top: 20px;
          padding: 10px;
          border-radius: 5px;
          display: none;
        }
        .success {
          background-color: #e8f5e9;
          color: #2e7d32;
          border: 1px solid #c8e6c9;
        }
        .error {
          background-color: #ffebee;
          color: #c62828;
          border: 1px solid #ffcdd2;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>${appName}</h1>
        <p>Connect your Apple Music account to access your library and playlists.</p>

        <button id="apple-music-authorize" class="button">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="white" d="M12.683 5.938c.57-.634 1.014-1.496 1.014-2.362 0-.12-.01-.239-.031-.355-.965.035-2.133.642-2.824 1.451-.553.624-.996 1.474-.996 2.34 0 .13.018.26.031.313.058.009.148.017.238.017.8 0 1.796-.511 2.568-1.404zm3.858 11.505c.8-1.235 1.125-1.97 1.125-3.16 0-2.496-1.823-3.778-3.646-3.778-.822 0-1.544.314-2.125.807-.47.4-.831.578-1.332.578-.535 0-.925-.187-1.432-.614-.515-.431-1.05-.756-1.913-.756-1.725 0-3.551 1.443-3.551 4.16 0 2.582 1.137 5.323 2.556 7.08.619.773 1.137 1.241 1.97 1.241.782 0 1.252-.474 1.883-.474.654 0 1.058.472 1.883.472.825 0 1.343-.447 1.97-1.248.426-.53.767-1.133 1.054-1.757-.61-.244-1.181-.634-1.592-1.15-.411-.517-.67-1.148-.67-1.822s.245-1.276.633-1.784c.39-.508.935-.91 1.575-1.17.196-.08.407-.14.632-.174-.22-.67-.57-1.267-1.02-1.751"></path>
          </svg>
          Connect Apple Music
        </button>

        <div id="status-message" class="status"></div>
      </div>

      <script>
        document.addEventListener('musickitloaded', function() {
          // Configure MusicKit with the developer token
          console.log('${developerToken}');
          MusicKit.configure({
            developerToken: '${developerToken}',
            app: {
              name: '${appName}',
              build: '1.0.0'
            }
          });

          // Get the MusicKit instance
          const music = MusicKit.getInstance();

          // Set up the authorize button
          document.getElementById('apple-music-authorize').addEventListener('click', async () => {
            try {
              // Request authorization
              await music.authorize();

              // User is now logged in, get the music user token
              const userToken = music.musicUserToken;

              // Display success message
              const statusElement = document.getElementById('status-message');
              statusElement.textContent = 'Successfully connected to Apple Music!';
              statusElement.className = 'status success';
              statusElement.style.display = "block";
              console.log({userToken});
              return
              // You can send this token to your server for future API requests
              await fetch('/save-user-token', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ userToken })
              });

              // Optional: redirect after successful login
              // window.location.href = '/dashboard';

            } catch (error) {
              console.error('Authorization error:', error);

              // Display error message
              const statusElement = document.getElementById('status-message');
              statusElement.textContent = 'Failed to connect: ' + (error.message || 'Unknown error');
              statusElement.className = 'status error';
              statusElement.style.display = 'block';
            }
          });
        });
      </script>
    </body>
    </html>
